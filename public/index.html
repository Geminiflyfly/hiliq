<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kslit — Cloudflare Pages + R2 + D1 轻量图床" />
  <title>Kslit · 轻量图床</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            sans: ['Sora', 'sans-serif'],
          },
          colors: {
            ink: {
              950: '#0B1F1C',
              800: '#163A34',
              600: '#2A5C52',
              400: '#5A8A7E',
              200: '#B7D0C8',
              50: '#F3F7F5',
            },
            tide: { 500: '#1F8A70', 400: '#2BA88A' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="./style.css?v=folders2" />
</head>
<body class="font-sans text-ink-950 antialiased is-booting">
  <div class="atmosphere" aria-hidden="true"></div>

  <!-- Guest: full-page login -->
  <section id="view-login" class="login-screen" hidden aria-labelledby="login-brand">
    <div class="login-canvas">
      <div class="login-visual" aria-hidden="true">
        <div class="lv-glow lv-glow-a"></div>
        <div class="lv-glow lv-glow-b"></div>
        <div class="lv-grid"></div>
        <div class="lv-stack">
          <div class="lv-shot lv-shot-1">
            <span class="lv-shot-grain"></span>
          </div>
          <div class="lv-shot lv-shot-2">
            <span class="lv-shot-grain"></span>
          </div>
          <div class="lv-shot lv-shot-3">
            <span class="lv-shot-grain"></span>
          </div>
        </div>
        <div class="lv-copy">
          <p class="lv-mark">Kslit</p>
          <p class="lv-caption">边缘图床 · 即传即链</p>
        </div>
        <div class="login-visual-frame"></div>
      </div>
      <div class="login-panel">
        <p id="login-brand" class="font-display text-5xl font-800 tracking-tight text-ink-950 sm:text-6xl">Kslit</p>
        <h1 id="login-heading" class="mt-4 text-xl font-medium text-ink-800 sm:text-2xl">登录后开始上传</h1>
        <p id="login-sub" class="mt-2 max-w-sm text-sm leading-relaxed text-ink-600">
          边缘图床 · R2 存储 · D1 账号
        </p>

        <form id="auth-form" class="login-form mt-10">
          <label class="field-label" for="auth-username">用户名</label>
          <input id="auth-username" class="field" autocomplete="username" required />
          <label class="field-label mt-4" for="auth-password">密码</label>
          <input id="auth-password" class="field" type="password" autocomplete="current-password" required />
          <button type="submit" id="btn-auth-submit" class="btn-primary btn-block mt-8">登录</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Authed app shell -->
  <div id="app-shell" hidden>
    <header class="site-header relative z-20">
      <nav class="mx-auto flex max-w-5xl items-center justify-between px-5 py-5 sm:px-8">
        <a href="#top" class="font-display text-lg font-800 tracking-tight text-ink-950">Kslit</a>
        <div class="flex items-center gap-1 text-sm" role="tablist" aria-label="视图切换">
          <button type="button" id="tab-upload" role="tab" aria-selected="true" class="tab-btn is-active" data-view="upload">上传</button>
          <button type="button" id="tab-gallery" role="tab" aria-selected="false" class="tab-btn" data-view="gallery">画廊</button>
          <button type="button" id="tab-users" role="tab" aria-selected="false" class="tab-btn hidden" data-view="users">用户</button>
          <button type="button" id="btn-auth" class="tab-btn tab-btn-account" title="账号">账号</button>
        </div>
      </nav>
    </header>

    <main id="top" class="relative z-10">
      <section id="view-upload" class="view is-visible" aria-labelledby="hero-brand">
        <div class="mx-auto max-w-5xl px-5 pb-16 pt-4 sm:px-8 sm:pt-8">
          <div class="hero-stage">
            <p id="hero-brand" class="font-display text-5xl font-800 leading-none tracking-tight text-ink-950 sm:text-7xl md:text-8xl">
              Kslit
            </p>
            <h1 class="mt-5 max-w-xl text-xl font-medium leading-snug text-ink-800 sm:text-2xl">
              把图片托到这里，立刻拿到可分享的链接
            </h1>
            <p class="mt-3 max-w-md text-sm leading-relaxed text-ink-600 sm:text-base">
              拖拽、点选或剪贴板粘贴，边缘直传 Cloudflare R2。
            </p>

            <div class="folder-bar mt-8 max-w-xl" id="folder-bar">
              <div class="folder-bar-head">
                <span class="folder-bar-title">文件夹</span>
                <span class="folder-bar-hint">支持多级目录，如 产品/春季</span>
              </div>
              <div class="folder-bar-row mt-2">
                <select id="upload-folder" class="field folder-select" aria-label="选择文件夹">
                  <option value="">根目录</option>
                </select>
              </div>
              <div class="folder-bar-actions mt-2">
                <button type="button" id="btn-new-folder" class="btn-ghost">新建文件夹</button>
                <button type="button" id="btn-new-subfolder" class="btn-ghost">新建子目录</button>
              </div>
            </div>

            <div class="mt-6">
              <label id="dropzone" for="file-input" class="dropzone group" tabindex="0">
                <input id="file-input" type="file" accept="image/*" multiple class="sr-only" />
                <span class="dropzone-ring" aria-hidden="true"></span>
                <span class="relative z-10 flex flex-col items-start gap-2">
                  <span class="text-sm font-semibold uppercase tracking-[0.18em] text-tide-500">上传图片</span>
                  <span class="text-lg font-medium text-ink-950 sm:text-xl">拖入文件，或点击选择</span>
                  <span class="text-sm text-ink-400">也可 <kbd class="kbd">Ctrl</kbd> / <kbd class="kbd">⌘</kbd> + <kbd class="kbd">V</kbd> 粘贴</span>
                </span>
              </label>
            </div>
          </div>

          <div id="upload-progress" class="mt-6 hidden" aria-live="polite"></div>
          <div id="upload-results" class="mt-10 space-y-6" aria-live="polite"></div>
        </div>
      </section>

      <section id="view-gallery" class="view" hidden aria-labelledby="gallery-title">
        <div class="mx-auto max-w-5xl px-5 pb-20 pt-6 sm:px-8 sm:pt-10">
          <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
              <h2 id="gallery-title" class="font-display text-4xl font-800 tracking-tight text-ink-950 sm:text-5xl">画廊</h2>
              <p class="mt-2 text-sm text-ink-600">浏览、复制链接或删除。</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <select id="gallery-folder" class="field folder-select-sm" aria-label="按文件夹筛选">
                <option value="">全部</option>
              </select>
              <button type="button" id="btn-refresh" class="btn-ghost">刷新</button>
            </div>
          </div>
          <div id="gallery-status" class="mt-6 text-sm text-ink-400" aria-live="polite">加载中…</div>
          <div id="gallery-grid" class="gallery-grid mt-8"></div>
          <div class="mt-10 flex justify-center">
            <button type="button" id="btn-more" class="btn-primary hidden">加载更多</button>
          </div>
        </div>
      </section>

      <section id="view-users" class="view" hidden aria-labelledby="users-title">
        <div class="mx-auto max-w-5xl px-5 pb-20 pt-6 sm:px-8 sm:pt-10">
          <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
              <h2 id="users-title" class="font-display text-4xl font-800 tracking-tight text-ink-950 sm:text-5xl">用户</h2>
              <p class="mt-2 text-sm text-ink-600">创建或删除账号。</p>
            </div>
            <button type="button" id="btn-refresh-users" class="btn-ghost">刷新</button>
          </div>
          <form id="form-create-user" class="user-form mt-8">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-ink-400">新建用户</h3>
            <div class="mt-3 grid gap-3 sm:grid-cols-4">
              <input id="new-username" class="field" placeholder="用户名" autocomplete="off" required />
              <input id="new-password" class="field" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" required />
              <select id="new-role" class="field">
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
              </select>
              <button type="submit" class="btn-primary">创建</button>
            </div>
          </form>
          <div id="users-status" class="mt-6 text-sm text-ink-400" aria-live="polite"></div>
          <div id="users-list" class="users-list mt-4"></div>
        </div>
      </section>
    </main>

    <footer class="relative z-10 border-t border-ink-200/60">
      <div class="mx-auto flex max-w-5xl flex-col gap-2 px-5 py-8 text-xs text-ink-400 sm:flex-row sm:items-center sm:justify-between sm:px-8">
        <span>Kslit · Pages + R2 + D1</span>
        <span>边缘上传 · 无打包</span>
      </div>
    </footer>
  </div>

  <!-- Account sheet (logged-in only) -->
  <div id="auth-overlay" class="overlay" hidden>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <h3 id="auth-title" class="font-display text-2xl font-800 text-ink-950">账号</h3>
      <p id="auth-hint" class="mt-2 text-sm leading-relaxed text-ink-600">当前登录信息</p>
      <div id="auth-logged-in" class="mt-6">
        <p class="text-sm text-ink-600">当前用户</p>
        <p id="auth-current-user" class="mt-1 text-lg font-medium text-ink-950"></p>
        <div class="mt-6 flex flex-wrap gap-3">
          <button type="button" id="btn-logout" class="btn-primary">退出登录</button>
          <button type="button" id="btn-close-auth-in" class="btn-ghost ml-auto">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="./app.js?v=folders2" type="module"></script>
</body>
</html>
