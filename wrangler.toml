# Hiliq / Cloudflare Pages
name = "hiliq"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# R2 绑定：binding 名必须是 BUCKET（代码里用 env.BUCKET）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vape-img"

# CDN_URL = R2 自定义域名（不要带 /img，也不要末尾 /）
# 有自定义域时外链形如 https://pic.kslit.com/文件夹/文件.png
[vars]
CDN_URL = "https://pic.kslit.com"
# UPLOAD_TOKEN = "change-me"
