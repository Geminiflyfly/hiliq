# Hiliq / Cloudflare Pages
name = "hiliq"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# R2 绑定：binding 名必须是 BUCKET（代码里用 env.BUCKET）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vape-img"

# D1 绑定（控制台已创建：img-db）
# 迁移：npx wrangler d1 migrations apply img-db --remote
[[d1_databases]]
binding = "DB"
database_name = "img-db"
database_id = "a6ff22e3-dc3c-42fb-9438-de23c686fe03"
migrations_dir = "migrations"

# CDN_URL = 图片专用域名（不要带 /img，也不要末尾 /）
# pic.kslit.com 是站点域名，不要填到这里
[vars]
CDN_URL = "https://img.kslit.com"
# UPLOAD_TOKEN = "change-me"
